# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "orbitalsense-dab"

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog catalog for OrbitalSense"
    default: "orbitalsense"
  schema:
    description: "Unity Catalog schema for OrbitalSense"
    default: "telemetry"
  warehouse_id:
    description: "SQL Warehouse ID for the OrbitalSense dashboard"
    default: "1cf90f29dc0ea17d"

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7990025474660843.3.azuredatabricks.net
    variables:
      catalog: "dev_orbitalsense"
      schema: "telemetry"

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://adb-7990025474660843.3.azuredatabricks.net
      # We always use /Users/richard.ogoma-a@nlng.onmicrosoft.com for all resources to make sure we only have a single copy.
      root_path: /Users/richard.ogoma-a@nlng.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as richard.ogoma-a@nlng.onmicrosoft.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: richard.ogoma-a@nlng.onmicrosoft.com
    variables:
      catalog: "orbitalsense"
      schema: "telemetry"
