resources:
  jobs:
    telemetry_simulator:
      name: "OrbitalSense Telemetry Simulator"
      description: >
        End-to-end orchestration: generates synthetic satellite telemetry
        with fault injection, then triggers the streaming pipeline to
        process the data through Bronze > Silver > Gold.
      tasks:
        - task_key: "generate_telemetry"
          description: "Generate telemetry JSON payloads into the UC Volume"
          spark_python_task:
            python_file: ../utilities/simulator.py
            parameters:
              - "--volume-path"
              - "/Volumes/${var.catalog}/${var.schema}/raw_telemetry_vol"
              - "--num-satellites"
              - "12"
              - "--batch-interval"
              - "5"
              - "--num-batches"
              - "100"
          environment_key: Default
        - task_key: "run_pipeline"
          description: "Trigger the streaming pipeline to process new telemetry"
          depends_on:
            - task_key: "generate_telemetry"
          pipeline_task:
            pipeline_id: ${resources.pipelines.orbital_sense_pipeline.id}
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
      permissions:
        - level: CAN_VIEW
          group_name: "users"
