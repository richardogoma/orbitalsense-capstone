resources:
  jobs:
    telemetry_simulator:
      name: "OrbitalSense Telemetry Simulator"
      description: >
        Generates synthetic satellite telemetry JSON payloads with fault
        injection (duplicates, missing fields, OOB voltage, dropout) and
        writes them to the raw_telemetry_vol UC Volume.
      tasks:
        - task_key: "generate_telemetry"
          description: "Generate telemetry JSON payloads into the UC Volume"
          spark_python_task:
            python_file: ../utilities/simulator.py
            parameters:
              - "--volume-path"
              - "/Volumes/${var.catalog}/${var.schema}/raw_telemetry_vol"
              - "--num-satellites"
              - "12"
              - "--batch-interval"
              - "5"
              - "--num-batches"
              - "100"
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED
      permissions:
        - level: CAN_VIEW
          group_name: "users"
